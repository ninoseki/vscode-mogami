name: Publish package

on:
  release:
    types: ['created']

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: publish-vscode-marketplace
    permissions:
      contents: write
      id-token: write # required for OIDC token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: 'npm'
      - run: npm ci
      - name: Set version from a tag
        run: npm version --no-git-tag-version ${GITHUB_EVENT_RELEASE_TAG_NAME}
        env:
          GITHUB_EVENT_RELEASE_TAG_NAME: ${{ github.event.release.tag_name }}
      - name: Package
        run: npm run package
      - name: Azure login (user-assigned managed identity)
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3.0.1
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
          enable-AzPSSession: true
      - name: Publish to VS Code Marketplace
        run: npx @vscode/vsce publish --azure-credential --packagePath ./*.vsix
      - name: Upload VSIX to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_EVENT_RELEASE_TAG_NAME: ${{ github.event.release.tag_name }}
        run: gh release upload ${GITHUB_EVENT_RELEASE_TAG_NAME} ./*.vsix
